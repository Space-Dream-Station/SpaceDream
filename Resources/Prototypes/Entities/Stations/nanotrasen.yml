- type: entity
  abstract: true
  id: BaseStationNanotrasen
  components:
    - type: NpcFactionMember
      factions:
        - NanoTrasen

- type: entity
  id: StandardNanotrasenStation
  parent:
    - BaseStation
    - BaseStationGoal # Corvax
    - BaseStationNews
    - BaseStationCargo
    - BaseStationJobsSpawning
    - BaseStationRecords
    - BaseStationArrivals
    - BaseStationGateway
    - BaseStationShuttles
    - BaseStationCentcomm
    - BaseStationEvacuation
    - BaseStationAlertLevels
    - BaseStationMagnet
    - BaseStationExpeditions
    - BaseStationSalvageJobs
    - BaseStationSiliconLawNTDefault # Corvax-NTDefault
    - BaseStationAllEventsEligible
    - BaseStationNanotrasen
    - BaseStationDeliveries
    - BaseDropPodTarget # ADT
    - BaseStationLavaland # ADT
  categories: [ HideSpawnMenu ]
  components:
    - type: Transform
    # SD Tweak Start
    - type: GridSpawn
      groups:
        ruins: !type:GridSpawnGroup
          hide: false
          nameGrid: true
          minCount: 1
          maxCount: 2
          stationGrid: false
          paths:
          - /Maps/ADTMaps/Ruins/bss_unluck.yml
          - /Maps/ADTMaps/Ruins/hotel_trivago.yml
          - /Maps/ADTMaps/Ruins/kamikaze.yml
          - /Maps/ADTMaps/Ruins/rnd_debris.yml
          - /Maps/ADTMaps/Ruins/sindy_apling.yml
          - /Maps/ADTMaps/Ruins/syndi_base.yml
          - /Maps/ADTMaps/Ruins/ussp_asteroid.yml
          - /Maps/ADTMaps/Ruins/ussp_debris.yml
    # SD Tweak End

- type: entity
  id: NanotrasenCentralCommand
  parent:
    - BaseStation
    - BaseStationAlertLevels
    - BaseStationNanotrasen
  categories: [ HideSpawnMenu ]
  components:
    - type: Transform

- type: entity
  id: StandardStationArena
  parent:
  - BaseStation
  - BaseStationJobsSpawning
  - BaseStationRecords
  - BaseStationNanotrasen
  categories: [ HideSpawnMenu ]
  components:
    - type: Transform
