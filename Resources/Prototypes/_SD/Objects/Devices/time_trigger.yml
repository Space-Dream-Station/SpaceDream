- type: entity
  id: DeviceTimeTrigger
  parent: BaseItem
  name: timetrigger
  description: An experimental device that can temporarily stop time.
  components:
  - type: Sprite
    sprite: _SD/Objects/Devices/timetrigger.rsi
    state: timetrigger
  - type: TriggerOnUse
  - type: UseDelayOnTrigger
  - type: UseDelayTriggerCondition
  - type: TriggerOnSignal
    port: Trigger
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 15
  - type: DeviceLinkSink
    ports:
    - Trigger
  - type: SpawnOnTrigger
    proto: Chronofield
  - type: UseDelay
    delay: 120
