- type: entity
  parent: BasePlushie
  id: PlushieResomiBlue
  name: resomi plushie
  description: SKREEEEEEEEEEEE!
  components:
  - type: Sprite
    sprite: _SD/Objects/Fun/Plushies/resomiblue.rsi
    state: icon
  - type: EmitSoundOnUse
    sound: &PlushieResomiSoundBlue
      path: /Audio/ADT/Voice/Resomi/resomi_scream.ogg
      params:
        volume: -5
  - type: EmitSoundOnLand
    sound: *PlushieResomiSoundBlue
  - type: EmitSoundOnActivate
    sound: *PlushieResomiSoundBlue
  - type: EmitSoundOnTrigger
    sound: *PlushieResomiSoundBlue
  - type: EmitSoundOnCollide
    sound: *PlushieResomiSoundBlue
  - type: Edible
    useSound: *PlushieResomiSoundBlue
  - type: MeleeWeapon
    soundHit: *PlushieResomiSoundBlue
  - type: Clothing
    quickEquip: false
    sprite: _SD/Objects/Fun/Plushies/resomiblue.rsi
    slots:
    - HEAD
    clothingVisuals:
      head:
      - state: equipped-HELMET
        offset: "0, 0.09"

