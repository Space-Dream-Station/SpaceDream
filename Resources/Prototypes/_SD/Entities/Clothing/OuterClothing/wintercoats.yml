- type: entity
  parent: [ClothingOuterArmorWarden, ClothingOuterWinterCoatToggleable, BaseSecurityContraband]
  id: SDClothingOuterWinterWardenOld
  name: зимняя бронекуртка смотрителя
  description: Прочная, утилитарная зимняя куртка, предназначенная для защиты смотрителя от любых угроз, связанных с бригом и переохлаждением. Эта выглядит помятой.
  components:
  - type: Sprite
    sprite: _SD/Clothing/OuterClothing/WinterCoats/coatwardenarmored.rsi
  - type: Clothing
    sprite: _SD/Clothing/OuterClothing/WinterCoats/coatwardenarmored.rsi
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        showEnts: False
        occludes: True
        ents: []
      toggleable-clothing: !type:ContainerSlot
        showEnts: False
        occludes: True
        ent: null

