- type: entity
  parent: VendingMachine
  id: VendingMachinePillowmat
  name: Pillowmat
  description: Distributes those soft fluffy high... Pillows!
  components:
  - type: ADTVendingMachine
    pack: PillowmatInventory
  - type: VendingMachineVisuals
    offState: off
    brokenState: broken
    normalState: normal-unshaded
    denyState: deny-unshaded
    loopDenyAnimation: false
  - type: Sprite
    sprite: _SD/Structures/Machines/VendingMachines/pillowmat.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]

- type: entity
  parent: VendingMachine
  id: VendingMachineSpeciesSnack
  name: Speciessnackmat
  description: Everything for everyone.
  components:
  - type: ADTVendingMachine
    pack: SpeciesSnackInventory
  - type: VendingMachineVisuals
    offState: off
    brokenState: broken
    normalState: normal-unshaded
    denyState: deny-unshaded
    ejectState: eject-unshaded
    loopDenyAnimation: false
  - type: Sprite
    sprite: _SD/Structures/Machines/VendingMachines/speciessnack.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]

